# ============================================
# HYPRLAND - Dynamic Tiling Wayland Compositor
# ============================================
# Adapted from niri + river configs
# Hardware: AMD Ryzen 9 9900X, NVIDIA RTX 5070Ti

# MONITOR CONFIGURATION
# ============================================
# Left monitor: Dell P2719H (1080p, 60Hz)
monitor = desc:Dell Inc. DELL P2719H FDS0R83, 1920x1080@60, 0x0, 1.0

# Right monitor: Dell AW2724DM (2K, 165Hz)
monitor = desc:Dell Inc. AW2724DM 4P02JV3, 2560x1440@165, 1920x0, 1.25

# TV disabled by default
monitor = HDMI-A-1, disable

# Fallback for any other monitor
monitor = , preferred, auto, 1

# ENVIRONMENT
# ============================================
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35
env = QT_SCALE_FACTOR,1
env = QT_FONT_DPI,96
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# NVIDIA-specific
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm

# INPUT CONFIGURATION
# ============================================
input {
    kb_layout = us,gr
    kb_options = grp:alt_shift_toggle
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }

    sensitivity = 0.2
    accel_profile = adaptive
}

# GENERAL SETTINGS
# ============================================
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    col.active_border = rgb(93a1a1)
    col.inactive_border = rgb(586e75)

    layout = dwindle
    no_focus_fallback = true
}

# CURSOR
# ============================================
cursor {
    no_warps = false
}

# DECORATION
# ============================================
decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# ANIMATIONS (minimal - keep it snappy)
# ============================================
animations {
    enabled = true

    animation = windows, 1, 2, default
    animation = windowsOut, 1, 2, default, popin 80%
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default
}

# LAYOUT
# ============================================
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# MISC
# ============================================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# XWAYLAND
# ============================================
xwayland {
    force_zero_scaling = true
}

# WORKSPACES
# ============================================
workspace = name:term, default:true
workspace = name:web
workspace = name:music
workspace = name:chat
workspace = name:misc

# WINDOW RULES
# ============================================
windowrulev2 = workspace name:web, class:^(firefox)$
windowrulev2 = workspace name:term, class:^(foot)$

windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$

# KEYBINDINGS
# ============================================
$mod = SUPER

# Launchers
bind = $mod SHIFT, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, B, exec, firefox
bind = $mod, E, exec, foot -e yazi
bind = $mod, N, exec, foot -e nvim
bind = $mod SHIFT, Escape, exec, waylock -init-color 0x002b36 -input-color 0x268bd2 -fail-color 0xdc322f

# Window management
bind = $mod SHIFT, C, killactive
bind = $mod SHIFT, E, exit
bind = $mod, M, fullscreen, 0
bind = $mod, F, fullscreen, 1
bind = $mod, Space, togglefloating

# Focus
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r

# Move windows
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r

# Resize windows
binde = $mod, Minus, resizeactive, -40 0
binde = $mod, Equal, resizeactive, 40 0
binde = $mod SHIFT, Minus, resizeactive, 0 -40
binde = $mod SHIFT, Equal, resizeactive, 0 40

# Promote to master
bind = $mod, Return, layoutmsg, swapwithmaster master

# Toggle split direction
bind = $mod, R, togglesplit

# Workspaces
bind = $mod, 1, workspace, name:term
bind = $mod, 2, workspace, name:web
bind = $mod, 3, workspace, name:music
bind = $mod, 4, workspace, name:chat
bind = $mod, 5, workspace, name:misc

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, name:term
bind = $mod SHIFT, 2, movetoworkspace, name:web
bind = $mod SHIFT, 3, movetoworkspace, name:music
bind = $mod SHIFT, 4, movetoworkspace, name:chat
bind = $mod SHIFT, 5, movetoworkspace, name:misc

# Monitor focus
bind = $mod, Period, focusmonitor, +1
bind = $mod, Comma, focusmonitor, -1

# Move window to monitor
bind = $mod SHIFT, Period, movewindow, mon:+1
bind = $mod SHIFT, Comma, movewindow, mon:-1

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Mouse wheel workspace switching
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Alternative media keys
bind = $mod ALT, P, exec, playerctl play-pause
bind = $mod ALT, bracketright, exec, playerctl next
bind = $mod ALT, bracketleft, exec, playerctl previous

# Screenshots
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | tee "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy && notify-send "Screenshot" "Saved and copied to clipboard"
bind = , Print, exec, grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" && notify-send "Screenshot" "Full screen saved"
bind = $mod, Print, exec, hyprctl -j activewindow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"' | grim -g - "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" && notify-send "Screenshot" "Window saved"

# Clipboard manager
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Restart waybar
bind = $mod SHIFT, W, exec, sh ~/.config/waybar/launch-waybar.sh

# Power menu
bind = $mod SHIFT, Delete, exec, sh ~/.config/hyprland/scripts/power-menu.sh

# Gaming mode - disable animations and borders for performance
bind = $mod SHIFT, G, exec, hyprctl --batch "keyword animations:enabled false ; keyword decoration:rounding 0 ; keyword general:gaps_in 0 ; keyword general:gaps_out 0 ; keyword general:border_size 0" && notify-send "Gaming Mode" "Enabled"
bind = $mod SHIFT CTRL, G, exec, hyprctl --batch "keyword animations:enabled true ; keyword general:border_size 2" && notify-send "Gaming Mode" "Disabled"

# Passthrough submap (for nested compositors/VMs)
bind = $mod, F11, submap, passthrough
submap = passthrough
bind = $mod, F11, submap, reset
submap = reset

# AUTOSTART
# ============================================
exec-once = sh ~/.config/hyprland/autostart.sh
