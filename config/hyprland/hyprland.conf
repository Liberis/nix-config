# ============================================
# HYPRLAND - Dynamic Tiling Wayland Compositor
# ============================================
# Hardware: AMD Ryzen 9 9900X, NVIDIA RTX 5070Ti
# Target Version: v0.53+ (February 2026)

# MONITOR CONFIGURATION
# ============================================
# Left monitor: Dell P2719H (1080p, 60Hz)
monitor = desc:Dell Inc. DELL P2719H FDS0R83, 1920x1080@60, 0x0, 1.0

# Right monitor: Dell AW2724DM (2K, 165Hz)
monitor = desc:Dell Inc. AW2724DM 4P02JV3, 2560x1440@165, 1920x0, 1.25

# TV disabled by default
monitor = HDMI-A-1, disable

# Fallback for any other monitor
monitor = , preferred, auto, 1

# ENVIRONMENT
# ============================================
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# NVIDIA-specific (RTX 50-series stability)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# INPUT CONFIGURATION
# ============================================
input {
    kb_layout = us,gr
    kb_options = grp:alt_shift_toggle
    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    # touchpad {
    #     natural_scroll = true
    #     disable_while_typing = true
    #     # FIX: Replaced 'tap-to-click' with 'tap_to_click' (underscores required)
    #     tap_to_click = true
    # }
    #
    sensitivity = 0.2
    accel_profile = adaptive
}

# GENERAL SETTINGS
# ============================================
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    col.active_border = rgb(93a1a1)
    col.inactive_border = rgb(586e75)

    layout = dwindle
}

# CURSOR
# ============================================
cursor {
    no_warps = false
    # Vital for NVIDIA to prevent cursor lag/invisibility
    no_hardware_cursors = true 
    inactive_timeout = 3
}

# DECORATION
# ============================================
decoration {
    rounding = 0

    blur {
        enabled = false
    }

    # Shadow configuration (Moved to its own object in recent versions)
    shadow {
        enabled = false
    }
}

# ANIMATIONS (Minimal/Snappy)
# ============================================
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, default
    animation = windowsOut, 1, 2, default, popin 80%
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default
}

# LAYOUT
# ============================================
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# MISC
# ============================================
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vfr = true
    # FIX: Removed 'font_family' (Invalid config option)
}

# XWAYLAND
# ============================================
xwayland {
    force_zero_scaling = true
}

# WORKSPACES
# ============================================
workspace = 1, name:term, default:true
workspace = 2, name:web
workspace = 3, name:music
workspace = 4, name:chat
workspace = 5, name:misc

# WINDOW RULES (Unified v0.53+ Syntax)
# ============================================
# NOTE: v0.53+ unifies rules into 'windowrule'.
# Flags like 'float' now require a boolean value (1 or 0).

# Workspace Assignments
#windowrule = workspace name:web, class:^(firefox)$
#windowrule = workspace name:term, class:^(foot)$

# Float rules (Must provide value '1' for true in new syntax)
#windowrule = float 1, title:^(Picture-in-Picture)$
#windowrule = float 1, class:^(pavucontrol)$
#windowrule = float 1, class:^(nm-connection-editor)$
#windowrule = float 1, title:^(Open File)$
#windowrule = float 1, title:^(Save File)$

# Optional: Center/Size rules (good practice for floating windows)
#windowrule = size 800 600, class:^(pavucontrol)$
#windowrule = center 1, class:^(pavucontrol)$

# KEYBINDINGS
# ============================================
$mod = SUPER

# Launchers
bind = $mod SHIFT, Return, exec, foot
# bind = $mod, D, exec, wofi --show drun
# bind = $mod, B, exec, firefox
# bind = $mod, E, exec, foot -e yazi
# bind = $mod, N, exec, foot -e nvim
bind = $mod SHIFT, Escape, exec, waylock -init-color 0x002b36 -input-color 0x268bd2

# Window management
bind = $mod SHIFT, C, killactive
bind = $mod SHIFT, E, exit
bind = $mod, M, fullscreen, 0
bind = $mod, F, fullscreen, 1
bind = $mod, Space, togglefloating

# Focus
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r

# Move windows
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r

# Resize windows (binde = repeated while held)
binde = $mod, Minus, resizeactive, -40 0
binde = $mod, Equal, resizeactive, 40 0
binde = $mod SHIFT, Minus, resizeactive, 0 -40
binde = $mod SHIFT, Equal, resizeactive, 0 40

# Promote to master / Layout management
bind = $mod, Return, layoutmsg, swapwithmaster master
bind = $mod, R, togglesplit

# Workspaces (Switch by ID for reliability)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Monitor focus
bind = $mod, Period, focusmonitor, +1
bind = $mod, Comma, focusmonitor, -1

# Move window to monitor
bind = $mod SHIFT, Period, movewindow, mon:+1
bind = $mod SHIFT, Comma, movewindow, mon:-1

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Mouse wheel workspace switching
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Media keys (bindel = repeat and work even if locked/muted)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | tee "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy && notify-send "Screenshot" "Saved and copied to clipboard"
bind = , Print, exec, grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png" && notify-send "Screenshot" "Full screen saved"

# Clipboard manager
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Restart waybar
bind = $mod SHIFT, W, exec, sh ~/.config/waybar/launch-waybar.sh

# Passthrough submap (v0.50+ syntax)
bind = $mod, F11, submap, passthrough
submap = passthrough
bind = $mod, F11, submap, reset
submap = reset

# AUTOSTART
# ============================================
exec-once = sh ~/.config/hyprland/autostart.sh
