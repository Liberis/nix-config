# Core settings
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Window and pane indexing (start at 1)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Mouse and scrolling
set -g mouse on
set -g history-limit 50000

# Terminal settings
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 0
set -g focus-events on

# Update Wayland/display env vars when clients attach (survives niri restarts)
set -g update-environment "DISPLAY WAYLAND_DISPLAY NIRI_SOCKET XDG_CURRENT_DESKTOP SSH_AUTH_SOCK SSH_AGENT_PID"

# Auto-renaming (shows remote host when SSH'd, otherwise dir: command)
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},#{pane_title},#{b:pane_current_path}: #{pane_current_command}}'


### One Dark style bar for tmux
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=#282c34,fg=#abb2bf"

# Window "tags" in center (SSH windows highlighted in red)
setw -g window-status-format '#{?#{==:#{pane_current_command},ssh},#[fg=#e06c75] #I  #W ,#[fg=#5c6370] #I #W }'
setw -g window-status-current-format '#{?#{==:#{pane_current_command},ssh},#[bg=#3e4451,fg=#e06c75,bold] #I  #W ,#[bg=#3e4451,fg=#abb2bf,bold] #I #W }'

# Left side: session name + current layout
set -g status-left-length 60
set -g status-left '#[fg=#56b6c2]  #S #[fg=#5c6370]│ #[fg=#c678dd]#{@layout} '
# Right side: MEM, LOAD, TIME
set -g status-right-length 120
set -g status-right '#[fg=#e5c07b] #(free -h | awk "/Mem:/ {print \$3}") #[fg=#d19a66] #(uptime | awk -F"load average:" "{print \$2}" | cut -d, -f1) #[fg=#5c6370]│ #[fg=#abb2bf]%a %d %b %H:%M '

# Pane borders in One Dark style
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#3e4451,fg=#61afef"
set -g mode-style "bg=#264f78,fg=white"

# ===== DYNAMIC TILING =====
# Per-window layout stored in @layout option, respected by hooks
set -wg @layout "main-vertical"
set -g main-pane-width '60%'
set -g main-pane-height '60%'

# Auto-reapply the chosen layout when panes are added/removed
set-hook -g after-split-window 'run-shell "tmux select-layout \"$(tmux show -wv @layout)\""'
set-hook -g pane-exited 'run-shell "tmux select-layout \"$(tmux show -wv @layout)\""'

# C-a T — cycle layout: main-vertical → main-horizontal → tiled → even-horizontal → even-vertical
bind T run-shell ' \
  current=$(tmux show -wv @layout 2>/dev/null || echo main-vertical); \
  case "$current" in \
    main-vertical) next=main-horizontal ;; \
    main-horizontal) next=tiled ;; \
    tiled) next=even-horizontal ;; \
    even-horizontal) next=even-vertical ;; \
    *) next=main-vertical ;; \
  esac; \
  tmux set -w @layout "$next"; \
  tmux select-layout "$next"; \
  tmux display-message "Layout: $next"'

# ===== KEY BINDINGS =====
# C-a N — new pane in current stack (split + auto-tile)
bind N split-window -v -c "#{pane_current_path}"
# C-a n — new window (separate stack, default tmux behavior)
bind n new-window -c "#{pane_current_path}"

# Manual pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Standard predefined layouts
bind-key M-1 select-layout even-horizontal  # Split screen vertically equal
bind-key M-2 select-layout even-vertical    # Split screen horizontally equal
bind-key M-3 select-layout main-horizontal  # Main pane on top, others on bottom
bind-key M-4 select-layout main-vertical    # Main pane on left, others on right
bind-key M-5 select-layout tiled            # Tile all panes evenly

# Fixed layout indicators matching tmux's internal naming
bind-key M-v select-layout main-vertical    # Large left pane, smaller ones on right
bind-key M-h select-layout main-horizontal  # Large top pane, smaller ones below
bind-key M-t select-layout tiled            # Equal grid of panes
bind-key M-e select-layout even-horizontal  # Equal columns
bind-key M-E select-layout even-vertical    # Equal rows

# Easy access to predefined layouts
bind-key M-Space next-layout                # Cycle through layouts
# Toggle zoom (maximize/restore a pane)
bind-key z resize-pane -Z

unbind '"'
unbind %

# Display pane numbers longer for easier navigation
set -g display-panes-time 2000

# Activity monitoring - visual indicators when a window has activity
setw -g monitor-activity on
set -g visual-activity off

# When a smaller client looks at the same session as a bigger client,
# make the smaller client show a different part of the window
setw -g aggressive-resize on

# Vim-style pane navigation (prefix + hjkl)
bind-key j select-pane -D
bind-key k select-pane -U
bind-key C-h select-pane -L
bind-key l select-pane -R

# Smart pane switching with awareness of Vim splits
# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane resizing (with repeat, prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize panes
bind s setw synchronize-panes

# Window and session management
bind c new-window -c "#{pane_current_path}"
bind w choose-window
bind d detach
bind x kill-pane
bind & kill-window

# Swap current pane to master position (pane 1)
bind Enter swap-pane -t 1

# Session/window tree switcher
bind S choose-tree -sZ

# Join a pane from another window into current window
bind @ choose-window 'join-pane -h -s "%%"'

# SSH host picker (fzf over ~/.ssh/config hosts)
bind C-s display-popup -w 60% -h 60% -E 'bash ~/.config/tmux/ssh-picker.sh'

# Configuration reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded!"

# ===== COPY MODE (VIM STYLE) =====
set-option -g mode-keys vi

# Copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Clipboard integration (Wayland + WSL fallback)
if-shell "[ -n \"$WAYLAND_DISPLAY\" ]" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
}
if-shell "grep -q Microsoft /proc/version 2>/dev/null" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
}

# Navigation in copy mode (vim-correct mappings)
bind -T copy-mode-vi WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi H send-keys -X top-line
bind -T copy-mode-vi M send-keys -X middle-line
bind -T copy-mode-vi L send-keys -X bottom-line
bind -T copy-mode-vi 0 send-keys -X start-of-line
bind -T copy-mode-vi ^ send-keys -X back-to-indentation
bind -T copy-mode-vi $ send-keys -X end-of-line
bind -T copy-mode-vi w send-keys -X next-word
bind -T copy-mode-vi e send-keys -X next-word-end
bind -T copy-mode-vi b send-keys -X previous-word
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
